<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.5;
        padding: 12px;
        color: #202124;
      }
      button {
        font-family: inherit;
        font-size: 13px;
        padding: 8px 14px;
        cursor: pointer;
        margin-bottom: 14px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        background: #f8f9fa;
      }
      button:disabled { cursor: default; opacity: 0.6; }

      #summary p { margin: 0 0 10px; }

      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        padding: 2px 8px;
        border-radius: 10px;
        margin-bottom: 10px;
      }
      .badge-measured { background: #e6f4ea; color: #137333; }
      .badge-low { background: #fef7e0; color: #b06000; }
      .badge-none { background: #f1f3f4; color: #5f6368; }
      .badge-error { background: #fce8e6; color: #c5221f; }

      .caveat {
        font-size: 11px;
        color: #5f6368;
        border-top: 1px solid #e8eaed;
        margin-top: 12px;
        padding-top: 10px;
      }

      details { margin-top: 14px; }
      summary { cursor: pointer; font-size: 11px; color: #5f6368; }
      pre {
        font-family: 'Courier New', monospace;
        font-size: 10px;
        white-space: pre-wrap;
        word-break: break-word;
        background: #f8f9fa;
        border: 1px solid #e8eaed;
        border-radius: 4px;
        padding: 8px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <button id="run">Check This Document</button>
    <div id="summary"><p>Click the button to check this document's writing pattern.</p></div>

    <script>
      function esc(s) {
        return String(s).replace(/[&<>]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c];
        });
      }

      function pluralize(n, singular, plural) {
        return n + ' ' + (n === 1 ? singular : plural);
      }

      // sig: { paste_ratio, paste_events, measured_revisions, session_gaps, status }
      function describeSignal(sig) {
        var lines = [];
        lines.push('Analyzed ' + pluralize(sig.measured_revisions, 'saved revision', 'saved revisions') +
          ', with ' + pluralize(sig.session_gaps, 'writing session break', 'writing session breaks') + ' detected.');

        if (sig.paste_events === 0) {
          lines.push('No large blocks of text appeared to arrive faster than typical typing speed — growth looks like ordinary incremental writing.');
        } else {
          var pct = Math.round(sig.paste_ratio * 100);
          lines.push('About ' + pct + '% of this document’s growth happened in ' +
            pluralize(sig.paste_events, 'fast, paste-like insertion', 'fast, paste-like insertions') +
            ' — text that arrived faster than typical typing speed.');
        }
        return lines;
      }

      function badge(text, cls) {
        return '<span class="badge badge-' + cls + '">' + esc(text) + '</span>';
      }

      function renderSuccess(result) {
        var html = '';
        var sig = result.pasteSignal;

        if (!sig) {
          html += badge('No signal', 'error');
          html += '<p>The document was read (' + result.revisionCount + ' revision' +
            (result.revisionCount === 1 ? '' : 's') + ' found), but the registry didn’t return a usable result ' +
            '(HTTP ' + result.httpStatus + '). See technical details below.</p>';
        } else if (sig.status === 'insufficient_data') {
          html += badge('Not enough history yet', 'none');
          html += '<p>Only ' + pluralize(sig.measured_revisions, 'saved revision', 'saved revisions') +
            ' found so far — not enough to check writing patterns. Google Docs saves periodically as you edit; ' +
            'keep writing and check again in a few minutes.</p>';
        } else {
          html += sig.status === 'low_confidence'
            ? badge('Early read — low confidence', 'low')
            : badge('Measured', 'measured');

          if (sig.status === 'low_confidence') {
            html += '<p><em>Only a few revisions so far — treat this as rough, not reliable yet.</em></p>';
          }

          describeSignal(sig).forEach(function (line) {
            html += '<p>' + esc(line) + '</p>';
          });
        }

        html += '<div class="caveat">This is a rough, provisional signal — not calibrated, and it can’t ' +
          'tell what the source of any fast insertion actually was (AI, a paste from your own notes, a quote, ' +
          'fast typing). It’s meant to support your own AI-use disclosure, not replace it.</div>';

        html += '<details><summary>Technical details</summary><pre>' +
          esc(JSON.stringify({
            docId: result.docId,
            httpStatus: result.httpStatus,
            pasteSignal: result.pasteSignal,
            rawPayload: result.rawPayload,
            rawResponse: safeParseForDisplay(result.rawResponse)
          }, null, 2)) + '</pre></details>';

        document.getElementById('summary').innerHTML = html;
      }

      function safeParseForDisplay(body) {
        try { return JSON.parse(body); } catch (e) { return body; }
      }

      function renderError(result) {
        var html = badge('Error', 'error');
        html += '<p>' + esc(result.message) + '</p>';
        if (result.stack) {
          html += '<details><summary>Technical details</summary><pre>' + esc(result.stack) + '</pre></details>';
        }
        document.getElementById('summary').innerHTML = html;
      }

      document.getElementById('run').addEventListener('click', function () {
        var btn = document.getElementById('run');
        var summary = document.getElementById('summary');
        btn.disabled = true;
        summary.innerHTML = '<p>Checking…</p>';

        google.script.run
          .withSuccessHandler(function (result) {
            btn.disabled = false;
            if (result && result.ok) {
              renderSuccess(result);
            } else {
              renderError(result || { message: 'Unknown error — no result returned.' });
            }
          })
          .withFailureHandler(function (error) {
            btn.disabled = false;
            renderError({ message: error.message, stack: error.stack || '' });
          })
          .testPlgenConnection();
      });
    </script>
  </body>
</html>
